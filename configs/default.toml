# Default settings for the EdgePlus reimplementation and the slack-aware rules.
# Values marked "EdgePlus" come from the paper; the rest are our choices (see README).

[city]
size_km = 10.0              # EdgePlus: 100 km2 city
clusters = 10               # EdgePlus: C = 10
seed = 38                   # EdgePlus seeds {38, 39, 40}
kmeans_iters = 100

[workload]
loads = [50000, 100000, 150000]          # EdgePlus load regimes (tasks per episode)
window_s = 600.0                          # simulated arrival window per episode
class_names = ["URLLC", "eMBB", "mMTC"]
class_shares = [0.20, 0.50, 0.30]         # EdgePlus Table IV
deadline_s = [[5.0, 15.0], [30.0, 120.0], [120.0, 600.0]]   # EdgePlus Sec. IV-B
class_weight = [3.0, 1.5, 1.0]            # w_p in reward and objective
tiering = "percentile"                    # "percentile" keeps the 20/50/30 mix; "absolute" uses thresholds
cycles_mean_g = [6.0, 12.0, 9.0]          # mean CPU work per class (Gcycles)
cycles_sigma = 0.47                       # lognormal sigma (coefficient of variation about 0.5)
cycles_severity_gain = 0.15               # heavier analysis for more severe readings
payload_kb = [2.0, 8.0, 1.0]
memory_mb = [64.0, 128.0, 32.0]
brasov_phase_jitter_s = 300.0             # sensors report every 5 min; spread their phase
brasov_train_days = 43                    # first 43 of 61 days train, last 18 test
delhi_train_months = ["Dec2020"]
delhi_test_months = ["Jan2021"]
# Absolute tiering thresholds (only used when tiering = "absolute"):
# Delhi PM2.5 (ug/m3): >120 = India AQI "Very Poor" or worse -> URLLC, 61-120 -> eMBB, <=60 -> mMTC
delhi_abs_thresholds = [120.0, 60.0]
brasov_abs_thresholds = [150.0, 100.0]

[servers]
stationary_per_cluster = 4
stationary_cores = 24
stationary_ghz = [2.4, 3.0, 3.6, 3.0]     # per node within a cluster
stationary_mem_gb = 64.0
mobile_per_cluster = 1
mobile_cores = 16
mobile_ghz = 2.4
mobile_mem_gb = 32.0
mobile_speed_mps = 15.0
mobile_range_km = 2.0
mobile_battery_j = 2000.0
cloud_cores = 32
cloud_ghz = 3.5
cloud_mem_gb = 1024.0
cloud_delay_s = 2.0                        # backhaul + core network, upload and result

[radio]
bandwidth_mhz = [20.0, 50.0, 5.0]         # per slice
reuse = 3.0                               # frequency reuse factor (Phi)
tx_power_dbm = 23.0
beamforming_gain_db = 20.0                # 6G massive-MIMO / RIS gain
noise_dbm_hz = -174.0
noise_figure_db = 7.0
eta_mac = 0.7
overhead = 1.2                            # eta_OH
channels = 20                             # parallel radio channels per cluster (slice airtime budget)

[energy]
kappa_j_per_gcycle = [0.0022, 0.0028, 0.0018]   # stationary, mobile, cloud (J per Gcycle at max frequency)
static_share = 0.25                        # share of compute energy that is static power at max frequency
tx_power_w = 0.2                           # device transmit power
cloud_offload_j = 0.004                    # backhaul energy per task sent to the cloud
move_j_per_m = 0.00002                     # mobile server movement energy
dvfs_levels = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]

[slices]
window_s = 60.0
compute_share = [0.25, 0.65, 0.35]         # reserved share of a cluster's compute per slice (sum > 1)
radio_share = [0.30, 0.55, 0.35]

[ledger]
rep_alpha = 0.05
rep_threshold = 0.6                        # EdgePlus rho_th
urllc_quarantine = 0.4                     # URLLC tasks avoid servers below this reputation
debt_target = 0.9
debt_alpha = 0.02
poa_ms = 0.39                              # EdgePlus median PoA validation (off the task path)

[advisory]
enabled = true
lambda_nash = 0.5
lambda_pid = 0.5
lambda_leader = 0.3
pid_gains = [1.90, 1.20, 0.06]             # EdgePlus Table VII best triplet
pid_setpoint = 0.8
pid_period_s = 1.0
nash_alpha = 1.0
nash_gamma = 1.0
nash_bounds = [0.5, 1.5]
nash_share = 0.5
leader_weights = [0.7, 0.3]
redeploy_period_s = 20.0
redeploy_detour = 1.3                      # straight-line distance x detour factor
redeploy_overload_u = -0.3
redeploy_spare_u = 0.2

[reward]
# EdgePlus Eq. 7 and Eq. 15: on-time, late, latency, energy, cloud, reputation, debt
eta = [1.0, 1.0, 0.2, 0.1, 0.2, 0.5, 0.5]
energy_ref_j = 0.03
scale = 0.5

[rules]
# Server-side rules. Baseline EdgePlus = fcfs / keep / off.
queue = "fcfs"          # fcfs | edf | prio
late = "keep"           # keep | drop | demote
dvfs = "off"            # off | naive | guarded
dvfs_guard_s = 1.5
dvfs_slack_use = 0.8

[ppo]
updates = 60
gamma = 0.95
gae_lambda = 0.9
clip = 0.2
epochs = 4
minibatch = 4096
lr = 3.0e-4
entropy = 0.01
value_coef = 0.5
kl_coef = 0.0
target_kl = 0.03
max_grad_norm = 0.5
actor_hidden = 64
critic_hidden = 128
train_window_s = 600.0
checkpoint_every = 2
